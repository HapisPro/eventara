name: eventara
description: "Eventara."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  cloud_firestore: ^6.0.2
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_svg: ^2.2.1
  flutter_timezone: ^5.0.0
  image_picker: ^1.2.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  supabase_flutter: ^2.10.3
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.0.11
  path: ^1.9.1
  timezone: ^0.10.0
  awesome_snackbar_content: ^0.1.8
  url_launcher: ^6.3.0
  google_fonts: ^6.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/vector/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/eventara_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/eventara_logo.png"
